[mypy]
# Global options — matches setup.py python_requires=">=3.11,<3.13"
python_version = 3.11
warn_return_any = True
warn_unused_configs = True
disallow_untyped_defs = False
check_untyped_defs = True

# Don't infer package bases by walking parent directories. Without this,
# a stray __init__.py above the repo root (e.g. a ComfyUI custom_nodes
# package at /path/to/gws/__init__.py) is treated as the parent package
# of metascan/ and mypy double-discovers every module under two names
# ("metascan.x" and "gws.metascan.metascan.x"), crashing on the first
# collision. CI doesn't hit this because runners are clean; local devs
# whose repo sits inside another Python package will.
explicit_package_bases = True

# Handle missing imports
ignore_missing_imports = True

# Third-party libraries without stubs
[mypy-nltk.*]
ignore_missing_imports = True

[mypy-ffmpeg.*]
ignore_missing_imports = True

[mypy-watchdog.*]
ignore_missing_imports = True

# Strict checking for core modules
[mypy-metascan.core.*]
disallow_untyped_defs = True
