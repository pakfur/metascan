        mult: {gender: {man: 0.3}}
        text: ""
      highlights:
        weight: 7
        requires:
          graying: [none, few_grays, temples]
          hair_length: [short, chin, shoulder, mid_back, waist]
        text: [caramel highlights, honey highlights, subtle face-framing highlights]
        mult: {gender: {man: 0.2}}
      balayage:
        weight: 5
        requires:
          graying: [none, few_grays, temples]
          hair_length: [shoulder, mid_back, waist]
