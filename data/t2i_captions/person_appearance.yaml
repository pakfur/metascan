# =============================================================================
# person_appearance.yaml
# Plausibility-constrained appearance sampler config for templated t2i prompts
# =============================================================================
#
# HOW IT WORKS
# ------------
# Attributes are sampled IN THE ORDER THEY APPEAR under `attributes:`.
# An attribute may only be conditioned on attributes that appear above it.
#
# Each candidate value's weight is computed as:
#
#   base weight
#     x every matching `mult` factor
#     x every matching `adjust` factor
#     -> 0 if any `requires` condition fails
#
# BASE WEIGHT comes from one of three sources (first that applies):
#   weights_from: ancestry      -> profiles.<sampled ancestry>.<this attribute>
#                                  (falls back to profiles._default.<attribute>)
#                                  values missing from the table get weight 0
#   weights_by: {attr: X, table: {...}}
#                               -> row of `table` whose key matches attribute X
#                                  (key may be a value id or a group name)
#                                  values missing from the row get weight 0
#   weight: N                   -> on the value itself (default 1)
#
# CONDITIONS (used by mult / requires / adjust / compose `when`)
#   Keys are attribute names. Values are lists of value ids OR group names
#   (see each attribute's `groups:`). `_unset` matches an attribute that was
#   skipped via `applies_when`.
#
#   mult:    {attr: {id_or_group: factor, ...}}         multiply when matched
#   requires:{attr: [id_or_group, ...]}                  zero unless matched
#   adjust:  [{when: {attr: [...], attr2: [...]}, factor: N}]
#                                                        compound (AND) condition
#
# MULTI-PICK: `pick: {min: 2, max: 3}` samples without replacement.
#   `excludes: [ids]` on a value removes those ids once it is picked
#   (checked in both directions).
#
# APPLIES_WHEN: attribute-level condition. If it fails the attribute is
#   `_unset` and renders as "".
#
# TEXT: a value's `text` may be
#   - a string
#   - a list (one is chosen at random per sample)
#   - a map keyed by the values/groups of `text_by` (default: gender),
#     with an optional `default` key; each entry may itself be a list.
#
# PLACEHOLDERS (in value text, compose rules and templates):
#   {attr}          chosen text of the sampled value (multi-pick joined "a, b and c")
#   {attr.field}    another field of the sampled value; lists -> random choice,
#                   2-item numeric `range`-style lists -> random int in range
#   {composed}      any field defined under `compose:`
#   {x|cap}         capitalise the first letter of any of the above
#   {x|a}           prefix with the right indefinite article (a/an)
#
# MIXED ANCESTRY: a value with `blend:` samples N parent ancestries and
#   averages their (normalised) profile tables. Attributes listed in
#   `blend.ordinal` are instead sampled once per parent and the midpoint of
#   the two positions (+/- jitter) is taken: intermediate tones, not bimodal.
#   For condition matching, a mixed person matches `mixed` AND each parent id.
#
# Weights are relative, not percentages. They are approximate population
# tendencies meant to keep combinations plausible, NOT rules about any
# individual; every profile deliberately keeps a tail of less common traits.
# Tune freely.
# =============================================================================

version: 1

attributes:

  # ---------------------------------------------------------------------------
  gender:
    values:
      woman:       {weight: 48, text: woman,  poss: her,   subj: she}
      man:         {weight: 48, text: man,    poss: his,   subj: he}
      androgynous: {weight: 4,  text: androgynous person, poss: their, subj: they}

  # ---------------------------------------------------------------------------
  # Apparent (visual) age. Adults only; floor is 21 so models don't drift young.
  apparent_age:
    groups:
      twenties:       [early_20s, mid_20s, late_20s]
      thirties:       [early_30s, late_30s]
      forties:        [early_40s, late_40s]
      fifties:        [early_50s, late_50s]
      sixties:        [early_60s, late_60s]
      seventies_plus: [seventies, eighties]
    values:
      early_20s: {weight: 7, text: early twenties, years: [21, 23]}
      mid_20s:   {weight: 7, text: mid-twenties,   years: [24, 26]}
      late_20s:  {weight: 8, text: late twenties,  years: [27, 29]}
      early_30s: {weight: 9, text: early thirties, years: [30, 34]}
      late_30s:  {weight: 9, text: late thirties,  years: [35, 39]}
      early_40s: {weight: 9, text: early forties,  years: [40, 44]}
      late_40s:  {weight: 8, text: late forties,   years: [45, 49]}
      early_50s: {weight: 8, text: early fifties,  years: [50, 54]}
      late_50s:  {weight: 7, text: late fifties,   years: [55, 59]}
      early_60s: {weight: 6, text: early sixties,  years: [60, 64]}
      late_60s:  {weight: 5, text: late sixties,   years: [65, 69]}
      seventies: {weight: 6, text: seventies,      years: [70, 79]}
      eighties:  {weight: 3, text: eighties,       years: [80, 88]}

  # ---------------------------------------------------------------------------
  # Population profile. Drives skin, hair colour/texture, eyes (see profiles:).
  ancestry:
    groups:
      african_descent:      [west_african, east_african, horn_african, southern_central_african,
                             afro_latin_caribbean, african_american]
      later_graying:        [west_african, east_african, horn_african, southern_central_african,
                             afro_latin_caribbean, african_american, east_asian, southeast_asian]
      lower_beard_density:  [east_asian, southeast_asian, indigenous_american]
      lower_baldness_rate:  [east_asian, southeast_asian, indigenous_american]
    values:
      west_african:             {weight: 5, text: [West African, Nigerian, Ghanaian, Senegalese, Ivorian]}
      east_african:             {weight: 3, text: [East African, Kenyan, Tanzanian, Ugandan]}
      horn_african:             {weight: 3, text: [Ethiopian, Eritrean, Somali]}
      southern_central_african: {weight: 3, text: [Congolese, Zambian, Zulu, Angolan]}
      north_african:            {weight: 4, text: [North African, Moroccan, Algerian, Tunisian, Egyptian]}
      middle_eastern:           {weight: 5, text: [Lebanese, Syrian, Jordanian, Iraqi, Palestinian, Turkish]}
      persian:                  {weight: 3, text: [Iranian, Persian, Kurdish]}
      south_asian:              {weight: 7, text: [Indian, Pakistani, Bangladeshi, Sri Lankan]}
      east_asian:               {weight: 7, text: [Chinese, Japanese, Korean, Taiwanese]}
      southeast_asian:          {weight: 5, text: [Filipino, Vietnamese, Thai, Indonesian, Malaysian]}
      central_asian:            {weight: 2, text: [Kazakh, Uzbek, Kyrgyz, Mongolian]}
      polynesian:               {weight: 2, text: [Samoan, Tongan, Māori, Native Hawaiian]}
      melanesian:               {weight: 1, text: [Papua New Guinean, Solomon Islander, Fijian, ni-Vanuatu]}
      aboriginal_australian:    {weight: 1, text: [Aboriginal Australian]}
      indigenous_american:      {weight: 3, text: [Native American, First Nations, Navajo, Quechua, Maya]}
      latin_american:
        weight: 6
        text:
          woman:   [Mexican, Colombian, Salvadoran, Guatemalan, Latina]
          man:     [Mexican, Colombian, Salvadoran, Guatemalan, Latino]
          default: [Mexican, Colombian, Salvadoran, Guatemalan]
      afro_latin_caribbean:     {weight: 4, text: [Jamaican, Haitian, Afro-Caribbean, Afro-Brazilian, Afro-Dominican]}
      african_american:         {weight: 5, text: [African American, Black American]}
      northern_european:        {weight: 4, text: [Swedish, Norwegian, Danish, Finnish, Icelandic]}
      celtic:                   {weight: 3, text: [Irish, Scottish, Welsh]}
      western_european:         {weight: 5, text: [English, German, Dutch, French, Belgian]}
      southern_european:        {weight: 5, text: [Italian, Spanish, Portuguese, Greek]}
      eastern_european:         {weight: 5, text: [Polish, Ukrainian, Russian, Czech, Lithuanian]}
      mixed:
        weight: 6
        text: "mixed {a} and {b}"      # {a}/{b} = parent texts
        blend:
          count: 2
          ordinal: [skin_tone]         # intermediate tone between the parents
          ordinal_jitter: 1            # midpoint of the parents' tones, +/- this many steps

  # ---------------------------------------------------------------------------
  # Ordered light -> deep (order matters for mixed-ancestry blending).
  # Roughly aligned with the 10-step Monk Skin Tone scale.
  skin_tone:
    weights_from: ancestry
    groups:
      light_tones: [porcelain, fair, light]
      mid_tones:   [light_medium, medium, tan]
      dark_tones:  [medium_brown, brown, deep_brown, very_deep]
    values:
      porcelain:    {text: [pale porcelain, very pale]}
      fair:         {text: fair}
      light:        {text: light}
      light_medium: {text: [light-medium, light beige]}
      medium:       {text: [medium, medium beige]}
      tan:          {text: [tan, golden-brown]}
      medium_brown: {text: medium brown}
      brown:        {text: [brown, rich brown]}
      deep_brown:   {text: [deep brown, dark brown]}
      very_deep:    {text: [very deep brown, deep ebony]}

  undertone:
    weights_from: ancestry
    text_by: skin_tone                # wording varies with depth of tone
    values:
      cool:
        text: {dark_tones: [cool undertones, "cool, blue-red undertones"], default: [cool pink undertones, cool undertones]}
        mult: {skin_tone: {dark_tones: 0.7}}
      neutral: {text: neutral undertones}
      warm:    {text: [warm golden undertones, warm undertones]}
      olive:   {text: olive undertones, mult: {skin_tone: {porcelain: 0.2, dark_tones: 0.3}}}

  # ---------------------------------------------------------------------------
  hair_texture:
    weights_from: ancestry
    values:
      straight: {text: [straight, fine straight], mult: {ancestry: {mixed: 0.7}}}
      wavy:     {text: [wavy, softly wavy],       mult: {ancestry: {mixed: 1.3}}}
      curly:    {text: [curly, springy curly],    mult: {ancestry: {mixed: 1.8}}}
      coily:    {text: [coily, tightly coiled]}

  # Natural pigment colour. Greying and dye are layered on later.
  hair_color:
    weights_from: ancestry
    values:
      black:             {text: [jet black, black]}
      soft_black:        {text: [soft black, off-black]}
      dark_brown:        {text: dark brown}
      chestnut:          {text: [chestnut brown, medium brown]}
      light_brown:       {text: light brown}
      dark_blonde:       {text: [dark blonde, dirty blonde],      mult: {ancestry: {mixed: 0.4}}}
      blonde:            {text: [golden blonde, honey blonde],    mult: {ancestry: {mixed: 0.3}}}
      platinum_blonde:   {text: [natural platinum blonde, white-blonde], mult: {ancestry: {mixed: 0.2}}}
      strawberry_blonde: {text: strawberry blonde, mult: {ancestry: {mixed: 0.3}}}
      auburn:            {text: auburn, mult: {ancestry: {mixed: 0.5}}}
      red:
        text: [copper red, ginger]
        mult: {ancestry: {mixed: 0.3}}
        adjust:
          - {when: {ancestry: [mixed], skin_tone: [dark_tones]}, factor: 0.3}

  graying:
    weights_by:
      attr: apparent_age
      table:
        twenties:       {none: 95, few_grays: 5}
        thirties:       {none: 70, few_grays: 22, temples: 8}
        forties:        {none: 40, few_grays: 28, temples: 15, salt_pepper: 15, gray: 2}
        fifties:        {none: 18, few_grays: 17, temples: 15, salt_pepper: 35, gray: 10, silver: 5}
        sixties:        {none: 6,  few_grays: 6,  temples: 8,  salt_pepper: 30, gray: 30, silver: 15, white: 5}
        seventies_plus: {none: 2,  few_grays: 2,  temples: 3,  salt_pepper: 15, gray: 35, silver: 23, white: 20}
    values:
      none:        {text: "", mult: {ancestry: {later_graying: 1.4}}}
      few_grays:   {text: a few strands of gray}
      temples:     {text: graying at the temples, mult: {gender: {man: 1.8, woman: 0.6}}}
      salt_pepper: {text: salt-and-pepper, mult: {ancestry: {later_graying: 0.8}}}
      gray:        {text: gray,            mult: {ancestry: {later_graying: 0.7}}}
      silver:      {text: [silver, steel-gray], mult: {ancestry: {later_graying: 0.7}}}
      white:       {text: [white, snow-white],  mult: {ancestry: {later_graying: 0.6}}}

  # ---------------------------------------------------------------------------
  hair_length:
    weights_by:
      attr: gender
      table:
        woman:       {bald: 0.02, buzzed: 0.2, very_short: 0.5, short: 1.2, chin: 2,   shoulder: 3,   mid_back: 2.5,  waist: 0.7}
        man:         {bald: 1,    buzzed: 2,   very_short: 3.5, short: 3,   chin: 0.7, shoulder: 0.5, mid_back: 0.15, waist: 0.05}
        androgynous: {bald: 0.3,  buzzed: 1.5, very_short: 2,   short: 2.5, chin: 2,   shoulder: 1.2, mid_back: 0.4,  waist: 0.1}
    values:
      bald:
        text: ""
        mult:
          apparent_age: {twenties: 0.4, thirties: 0.8, forties: 1.4, fifties: 2.0, sixties: 2.6, seventies_plus: 3.0}
          ancestry: {lower_baldness_rate: 0.6}
      buzzed:     {text: buzzed}
      very_short: {text: very short, mult: {apparent_age: {sixties: 1.3, seventies_plus: 1.5}}}
      short:      {text: short,      mult: {apparent_age: {sixties: 1.4, seventies_plus: 1.7}}}
      chin:       {text: chin-length, mult: {apparent_age: {sixties: 1.2, seventies_plus: 1.2}}}
      shoulder:   {text: shoulder-length}
      mid_back:   {text: [long, mid-back-length], mult: {apparent_age: {sixties: 0.6, seventies_plus: 0.35}, hair_texture: {coily: 0.6}}}
      waist:      {text: [very long, waist-length], mult: {apparent_age: {fifties: 0.7, sixties: 0.4, seventies_plus: 0.25}, hair_texture: {coily: 0.3}}}

  hairline:
    applies_when: {gender: [man], hair_length: [buzzed, very_short, short, chin, shoulder, mid_back, waist]}
    weights_by:
      attr: apparent_age
      table:
        twenties:       {full: 80, slightly_receding: 15, receding: 5}
        thirties:       {full: 55, slightly_receding: 25, receding: 13, thinning_crown: 7}
        forties:        {full: 38, slightly_receding: 25, receding: 22, thinning_crown: 15}
        fifties:        {full: 25, slightly_receding: 22, receding: 30, thinning_crown: 23}
        sixties:        {full: 20, slightly_receding: 20, receding: 32, thinning_crown: 28}
        seventies_plus: {full: 18, slightly_receding: 18, receding: 34, thinning_crown: 30}
    values:
      full:              {text: "", mult: {ancestry: {lower_baldness_rate: 1.4, african_descent: 1.2}}}
      slightly_receding: {text: a slightly receding hairline}
      receding:          {text: a receding hairline, mult: {ancestry: {lower_baldness_rate: 0.6, african_descent: 0.8}}}
      thinning_crown:    {text: a thinning crown,    mult: {ancestry: {lower_baldness_rate: 0.6, african_descent: 0.8}}}

  # ---------------------------------------------------------------------------
  # Style text is a full phrase. Placeholders:
  #   {hair_length} {hair_texture} {hair_shade}  (hair_shade = colour after greying/dye)
  # Every (length x texture) pair has at least one gender-neutral fallback
  # (shaved_head, buzz_cut, crew_cut, tousled/twa, loose_down).
  hair_style:
    values:
      # --- bald ---
      shaved_head:      {weight: 3, requires: {hair_length: [bald]}, text: [a clean-shaven head, a smooth shaved head]}
      bald_crown:
        weight: 2
        requires: {hair_length: [bald], gender: [man]}
        text: a bald crown with closely cropped {hair_shade} sides
        mult: {apparent_age: {twenties: 0.2, thirties: 0.6, sixties: 1.5, seventies_plus: 2}}
      # --- buzzed ---
      buzz_cut:         {weight: 3, requires: {hair_length: [buzzed]}, text: "{hair_shade|a} buzz cut"}
      buzz_fade:
        weight: 2
        requires: {hair_length: [buzzed]}
        text: "{hair_shade|a} buzz cut with a skin fade"
        mult: {apparent_age: {fifties: 0.5, sixties: 0.3, seventies_plus: 0.2}}
      # --- very short ---
      crew_cut:         {weight: 3, requires: {hair_length: [very_short]}, text: "a short {hair_shade} crew cut", mult: {gender: {woman: 0.3}}}
      caesar_cut:
        weight: 1.5
        requires: {hair_length: [very_short], hair_texture: [straight, wavy, curly]}
        text: "{hair_shade|a} Caesar cut with a short forward-brushed fringe"
        mult: {gender: {woman: 0.2}}
      waves_360:
        weight: 3
        requires: {hair_length: [very_short], hair_texture: [coily, curly]}
        text: "{hair_shade} 360 waves"
        mult: {gender: {woman: 0.2}, apparent_age: {sixties: 0.5, seventies_plus: 0.3}}
      twa:
        weight: 3
        requires: {hair_length: [very_short, short], hair_texture: [coily, curly]}
        text: a short {hair_texture} {hair_shade} natural afro
        mult: {gender: {woman: 1.5}}
      tapered_natural:
        weight: 2
        requires: {hair_length: [very_short, short], hair_texture: [coily]}
        text: a tapered {hair_shade} natural cut
        mult: {gender: {woman: 1.5, man: 0.5}}
      pixie:
        weight: 3
        requires: {hair_length: [very_short, short], hair_texture: [straight, wavy, curly]}
        text: "{hair_texture|a} {hair_shade} pixie cut"
        mult: {gender: {man: 0.02}, apparent_age: {sixties: 1.5, seventies_plus: 1.8}}
      # --- short ---
      textured_crop:
        weight: 3
        requires: {hair_length: [short], hair_texture: [straight, wavy, curly]}
        text: a textured {hair_shade} crop with a short fringe
        mult: {gender: {woman: 0.2}, apparent_age: {fifties: 0.6, sixties: 0.4, seventies_plus: 0.3}}
      side_part:
        weight: 3
        requires: {hair_length: [short], hair_texture: [straight, wavy]}
        text: short {hair_shade} hair neatly combed with a side part
        mult: {gender: {woman: 0.4}, apparent_age: {fifties: 1.4, sixties: 1.6, seventies_plus: 1.8}}
      quiff:
        weight: 2
        requires: {hair_length: [short], hair_texture: [straight, wavy]}
        text: "{hair_shade|a} quiff, short on the sides and swept up in front"
        mult: {gender: {woman: 0.1}, apparent_age: {sixties: 0.4, seventies_plus: 0.3}}
      curly_top_fade:
        weight: 3
        requires: {hair_length: [short], hair_texture: [wavy, curly, coily]}
        text: short {hair_texture} {hair_shade} hair on top with a taper fade
        mult: {gender: {woman: 0.3}, apparent_age: {sixties: 0.5, seventies_plus: 0.4}}
      high_top_fade:
        weight: 1
        requires: {hair_length: [short], hair_texture: [coily]}
        text: "{hair_shade|a} high-top fade"
        mult: {gender: {woman: 0.2}, apparent_age: {thirties: 0.7, forties: 0.4, fifties: 0.2, sixties: 0.1, seventies_plus: 0.1}}
      comb_over:
        weight: 1
        requires: {hair_length: [short], hair_texture: [straight, wavy], gender: [man], hairline: [receding, thinning_crown]}
        text: thin {hair_shade} hair in a comb-over
        mult: {apparent_age: {twenties: 0, thirties: 0.1, forties: 0.4, sixties: 1.6, seventies_plus: 2}}
      # --- short / chin ---
      undercut:
        weight: 2
        requires: {hair_length: [short, chin], hair_texture: [straight, wavy]}
        text: "{hair_texture} {hair_shade} hair in an undercut, longer on top"
        mult: {gender: {woman: 0.4}, apparent_age: {fifties: 0.4, sixties: 0.2, seventies_plus: 0.1}}
      slicked_back:
        weight: 2
        requires: {hair_length: [short, chin], hair_texture: [straight, wavy]}
        text: "{hair_shade} hair slicked back"
        mult: {gender: {woman: 0.4}}
      tousled:
        weight: 3
        requires: {hair_length: [short, chin], hair_texture: [straight, wavy, curly]}
        text: tousled {hair_length} {hair_texture} {hair_shade} hair
      mullet:
        weight: 0.7
        requires: {hair_length: [short, chin], hair_texture: [straight, wavy, curly]}
        text: "{hair_shade|a} {hair_texture} mullet"
        mult: {apparent_age: {thirties: 0.6, forties: 0.3, fifties: 0.15, sixties: 0.1, seventies_plus: 0.05}}
      # --- chin ---
      bob:
        weight: 4
        requires: {hair_length: [chin], hair_texture: [straight, wavy]}
        text: ["a chin-length {hair_shade} bob", "a blunt {hair_shade} bob"]
        mult: {gender: {man: 0.03, androgynous: 0.8}}
      textured_bob:
        weight: 3
        requires: {hair_length: [chin, shoulder], hair_texture: [wavy, curly, coily]}
        text: "{hair_texture|a} {hair_shade} bob"
        mult: {gender: {man: 0.05}}
      shag:
        weight: 2
        requires: {hair_length: [chin, shoulder], hair_texture: [straight, wavy, curly]}
        text: "{hair_length|a} {hair_texture} {hair_shade} shag with feathered layers"
        mult: {gender: {man: 0.4}, apparent_age: {sixties: 0.6, seventies_plus: 0.4}}
      wolf_cut:
        weight: 1
        requires: {hair_length: [chin, shoulder], hair_texture: [straight, wavy]}
        text: a choppy {hair_shade} wolf cut
        mult: {apparent_age: {thirties: 0.6, forties: 0.3, fifties: 0.1, sixties: 0.05, seventies_plus: 0.02}}
      afro:
        weight: 3
        requires: {hair_length: [chin, shoulder], hair_texture: [coily, curly]}
        text: a full, rounded {hair_shade} afro
      swept_back:
        weight: 2
        requires: {hair_length: [chin, shoulder], hair_texture: [straight, wavy, curly]}
        text: "{hair_length} {hair_texture} {hair_shade} hair swept back from the face"
        mult: {gender: {woman: 0.3}}
      tucked_behind_ears:
        weight: 2
        requires: {hair_length: [chin, shoulder], hair_texture: [straight, wavy, curly]}
        text: "{hair_length} {hair_texture} {hair_shade} hair tucked behind the ears"
      # --- chin+ ---
      loose_down:
        weight: 6
        requires: {hair_length: [chin, shoulder, mid_back, waist]}
        text: "{hair_length} {hair_texture} {hair_shade} hair worn loose"
      curtain_bangs:
        weight: 2
        requires: {hair_length: [chin, shoulder, mid_back], hair_texture: [straight, wavy]}
        text: "{hair_length} {hair_texture} {hair_shade} hair with curtain bangs"
        mult: {gender: {man: 0.2}}
      blunt_bangs:
        weight: 1.5
        requires: {hair_length: [chin, shoulder, mid_back], hair_texture: [straight]}
        text: "{hair_length} straight {hair_shade} hair with blunt bangs"
        mult: {gender: {man: 0.05}}
      defined_curls:
        weight: 3
        requires: {hair_length: [chin, shoulder, mid_back], hair_texture: [curly]}
        text: "{hair_length} defined {hair_shade} curls"
      defined_coils:
        weight: 3
        requires: {hair_length: [chin, shoulder, mid_back], hair_texture: [coily]}
        text: "{hair_length} defined {hair_shade} coils"
      puff:
        weight: 2
        requires: {hair_length: [chin, shoulder, mid_back], hair_texture: [coily, curly]}
        text: "{hair_texture} {hair_shade} hair gathered into a high puff"
        mult: {gender: {man: 0.1}}
      two_strand_twists:
        weight: 2.5
        requires: {hair_length: [chin, shoulder, mid_back], hair_texture: [coily]}
        text: "{hair_length} {hair_shade} two-strand twists"
      bantu_knots:
        weight: 1
        requires: {hair_length: [chin, shoulder], hair_texture: [coily, curly]}
        text: "{hair_shade} hair in Bantu knots"
        mult: {gender: {man: 0.05}, apparent_age: {forties: 0.5, fifties: 0.3, sixties: 0.2, seventies_plus: 0.1}}
      box_braids:
        weight: 4
