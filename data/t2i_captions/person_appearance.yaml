  # ---------------------------------------------------------------------------
  # 2-3 visible skin details, driven by apparent age, then filtered/boosted
  # by skin tone, hair colour, ancestry and gender.
  skin_condition:
    pick: {min: 2, max: 3}
    weights_by:
      attr: apparent_age
      table:
        twenties:
          {smooth_clear: 20, dewy: 12, visible_pores: 15, light_freckles: 8, heavy_freckles: 3,
           mild_blemishes: 12, acne_scars: 5, rosy_cheeks: 5, oily_tzone: 6, under_eye_shadows: 4,
           hyperpigmentation: 4, beauty_mark: 4, moles: 3, vitiligo: 0.5}
        thirties:
          {smooth_clear: 10, dewy: 7, visible_pores: 15, light_freckles: 7, heavy_freckles: 2,
           mild_blemishes: 5, acne_scars: 5, rosy_cheeks: 5, oily_tzone: 4, under_eye_shadows: 8,
           laugh_lines: 10, fine_lines: 8, forehead_lines: 4, crows_feet: 3, hyperpigmentation: 5,
           melasma: 3, beauty_mark: 4, moles: 3, vitiligo: 0.5}
        forties:
          {smooth_clear: 3, visible_pores: 12, light_freckles: 6, heavy_freckles: 2, mild_blemishes: 1,
           acne_scars: 4, rosy_cheeks: 6, under_eye_shadows: 9, laugh_lines: 12, fine_lines: 12,
           forehead_lines: 9, crows_feet: 10, sun_weathered: 3, hyperpigmentation: 5, melasma: 4,
           raised_dark_spots: 3, age_spots: 2, beauty_mark: 3, moles: 4, vitiligo: 0.5}
        fifties:
          {visible_pores: 10, light_freckles: 5, heavy_freckles: 2, rosy_cheeks: 6, under_eye_shadows: 10,
           laugh_lines: 12, fine_lines: 8, forehead_lines: 12, crows_feet: 14, deep_wrinkles: 4,
           softened_jawline: 7, sun_weathered: 5, age_spots: 6, hyperpigmentation: 4, melasma: 2,
           raised_dark_spots: 5, moles: 4, vitiligo: 0.5}
        sixties:
          {visible_pores: 6, light_freckles: 3, rosy_cheeks: 5, under_eye_shadows: 10, laugh_lines: 10,
           forehead_lines: 12, crows_feet: 14, deep_wrinkles: 14, softened_jawline: 12, sun_weathered: 7,
           age_spots: 12, raised_dark_spots: 6, crepey: 3, moles: 4, vitiligo: 0.5}
        seventies_plus:
          {under_eye_shadows: 8, laugh_lines: 6, forehead_lines: 8, crows_feet: 10, deep_wrinkles: 25,
           softened_jawline: 14, sun_weathered: 7, age_spots: 16, raised_dark_spots: 6, crepey: 14,
           moles: 4, vitiligo: 0.5}
    values:
      smooth_clear:
        text: ["a smooth, clear complexion", "clear, even skin"]
        excludes: [dewy, visible_pores, mild_blemishes, acne_scars, deep_wrinkles, sun_weathered, crepey, oily_tzone]
      dewy:            {text: ["a dewy, healthy glow", "naturally glowing skin"], excludes: [sun_weathered, crepey]}
      visible_pores:   {text: [natural skin texture with visible pores, realistic skin texture]}
      light_freckles:
        text: [a light dusting of freckles across the nose, faint freckles across the cheeks]
        requires: {skin_tone: [light_tones, light_medium, medium]}
        mult:
          hair_color: {red: 3, strawberry_blonde: 3, auburn: 2}
          ancestry: {celtic: 2, northern_european: 1.5}
        excludes: [heavy_freckles]
      heavy_freckles:
        text: [dense freckles across the face, heavily freckled skin]
        requires: {skin_tone: [porcelain, fair, light]}
        mult:
          hair_color: {red: 5, strawberry_blonde: 4, auburn: 2.5}
          ancestry: {celtic: 2.5}
      mild_blemishes:  {text: [a few small blemishes, a couple of small breakouts]}
      acne_scars:      {text: faint acne scarring on the cheeks}
      rosy_cheeks:
        text: ["naturally flushed, rosy cheeks", "ruddy cheeks"]
        requires: {skin_tone: [light_tones, light_medium]}
        mult: {ancestry: {celtic: 1.8, northern_european: 1.4}}
      oily_tzone:      {text: a slightly shiny T-zone}
      under_eye_shadows: {text: [soft under-eye shadows, faint under-eye bags]}
      laugh_lines:     {text: laugh lines}
      fine_lines:      {text: [fine lines around the eyes, subtle fine lines], excludes: [deep_wrinkles]}
      forehead_lines:  {text: horizontal forehead lines}
      crows_feet:      {text: crow's feet}
      deep_wrinkles:   {text: [deep-set wrinkles, deeply lined skin]}
      softened_jawline: {text: [a softened jawline, slight jowls]}
      sun_weathered:   {text: ["sun-weathered skin", "weathered, outdoorsy skin"], excludes: [dewy]}
      age_spots:
        text: [age spots on the temples and cheeks, scattered sunspots]
        mult: {skin_tone: {light_tones: 1.8, dark_tones: 0.3}}
      hyperpigmentation:
        text: [mild uneven pigmentation, a slightly uneven skin tone]
        mult: {skin_tone: {light_tones: 0.5, mid_tones: 1.3, dark_tones: 1.5}}
      melasma:
        text: faint melasma patches on the cheeks
        requires: {skin_tone: [light_medium, medium, tan, medium_brown, brown]}
        mult: {gender: {man: 0.1}}
      raised_dark_spots:            # dermatosis papulosa nigra
        text: small raised dark spots across the cheekbones
        requires: {skin_tone: [tan, dark_tones]}
      crepey:          {text: ["thin, crepey skin", "delicate papery skin"], excludes: [dewy, smooth_clear]}
      vitiligo:        {text: [patches of vitiligo, small vitiligo patches around the eyes and mouth]}
      beauty_mark:     {text: [a small beauty mark, a beauty mark near the lip]}
      moles:           {text: a few small moles}

