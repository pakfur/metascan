# -----------------------------------------------------------------------------
# Derived phrases. For each field the FIRST rule whose `when` matches wins.
# A rule with no `when` always matches (use it last as the fallback).
# -----------------------------------------------------------------------------
compose:
  # Colour actually visible on the head
  hair_shade:
    - when: {hair_treatment: [vivid, bleached]}
      text: "{hair_treatment}"
    - when: {hair_treatment: [cover_gray]}
      text: "{hair_color}"
    - when: {graying: [salt_pepper, gray, silver, white]}
      text: "{graying}"
    - text: "{hair_color}"

  # Trailing clause after the style phrase
  hair_suffix:
    - when: {hair_length: [bald]}
      text: ""
    - when: {hair_treatment: [highlights, balayage]}
      text: ", with {hair_treatment}"
    - when: {hair_treatment: [natural], graying: [few_grays]}
      text: ", with {graying}"
    - when: {hair_treatment: [natural], graying: [temples]}
      text: ", {graying}"
    - text: ""

  hairline_clause:
    - when: {hairline: [_unset, full]}
      text: ""
    - text: ", with {hairline}"

  hair:
    - text: "{hair_style}{hair_suffix}{hairline_clause}"

  # Beards follow natural colour + greying, never the dye
  beard_shade:
    - when: {graying: [gray, silver, white]}
      text: "{graying}"
    - when: {graying: [salt_pepper]}
      text: salt-and-pepper
    - text: "{hair_color}"

  facial_hair_clause:
    - when: {facial_hair: [_unset]}
      text: ""
    - when: {hair_length: [bald], facial_hair: [clean_shaven]}
      text: ""
    - text: ", {facial_hair}"

  # The caption engine's own fields (see engine: below).
  # hair_token is what __HAIR__ becomes and what the "the auburn-haired woman"
  # handle is built from: colour only, ending in " hair". Bald -> no handle.
  hair_token:
    - when: {hair_length: [bald]}
      text: ""
    - text: "{hair_shade} hair"

  # A beard as its own detail; clean-shaven says nothing.
  beard:
    - when: {facial_hair: [_unset, clean_shaven]}
      text: ""
    - text: "{facial_hair}"

  eyes:
    - text: "{eye_shape} {eye_color} eyes"

  skin:
    - text: "{skin_tone} skin with {undertone}, {skin_condition}"

  subject:
    - text: "{ancestry} {gender} in {gender.poss} {apparent_age}"

# -----------------------------------------------------------------------------
# What the T2I caption engine takes from a sampled person
# (metascan/core/t2i_appearance.py). Each named character (__ALICE__ ...) is
# one person drawn from the caption text, so one caption always draws the same
# cast. Its first mention reads
#   "a <head slots> <noun> with <with slots>"
# e.g. "a 31-year-old Ghanaian woman with deep brown skin, ..." (a drawn age of
# 40+ also says "middle aged", 71+ "old"). Empty slots are left out.
#
#   genders:  a name's gender (characters.yml) -> the gender value it draws
#   slots:    slot -> template (any attribute, field or composed phrase)
#   head:     slots in front of the noun
#   with:     slots after "with"
#   spells:   a token the caption writes (__HAIR__) -> the with-slots it
#             replaces, so the hair is never described twice
#   distinct: a slot kept different across the cast (the handles name it)
#
# Every text here and above passes the adult-only screen at load time; a
# drawn slot is screened again before it reaches a prompt.
# -----------------------------------------------------------------------------
engine:
  genders: {female: woman, male: man}
  slots:
    age:       "{apparent_age.years}-year-old"
    ethnicity: "{ancestry}"
    skin:      "{skin_tone} skin"
    eyes:      "{eyes}"
    face:      "{face_shape}"
    hairstyle: "{hair}"
    beard:     "{beard}"
    body:      "{body_type}"
    hair:      "{hair_token}"
  head: [age, ethnicity]
  with: [skin, eyes, face, hairstyle, beard, body]
  spells: {hair: [hairstyle]}
  distinct: hair

# -----------------------------------------------------------------------------
# Example templates (sample_person.py --template). Not used by the caption
# engine. Any attribute or composed field can be referenced.
# -----------------------------------------------------------------------------
templates:
  portrait: >-
    portrait photograph of {subject|a}, {body_type}, {face_shape}, {eyes},
    {skin}, {hair}{facial_hair_clause}

  numeric_age: >-
    a {apparent_age.years}-year-old {ancestry} {gender} with {face_shape} and {eyes},
    {skin_tone} skin, {hair}{facial_hair_clause}, {body_type}

  natural_language: >-
    A candid photo of an adult {subject}. {gender.subj|cap} has {body_type}, {face_shape}
    and {eyes}. {gender.poss|cap} {skin_tone} skin has {undertone} and shows {skin_condition}.
    {gender.poss|cap} hair: {hair}{facial_hair_clause}.
