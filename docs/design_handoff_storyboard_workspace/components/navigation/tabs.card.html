<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{background:var(--surface-card);padding:0}#root{padding:0}.pane{padding:14px}</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { Tabs, Field, Textarea } = window.MetascanDesignSystem_f2fbbd;
function Card(){
  const [tab,setTab] = React.useState('edit');
  return (<div>
    <Tabs tabs={[{value:'edit',label:'Edit'},{value:'preview',label:'Preview'}]} value={tab} onChange={setTab} />
    <div className="pane">
      {tab==='edit'
        ? <Field label="Action"><Textarea rows={3} defaultValue="Mara pushes the door with her shoulder; the bell does not ring." /></Field>
        : <Field label="Shot script"><pre className="ms-script" style={{maxHeight:110}}>{'SHOT 3 — MCU, eye, normal\n  Mara (primary), Ines\n\n[Beat 1] 2.5s  push in, slow\n  Mara pushes the door with her shoulder.'}</pre></Field>}
    </div>
  </div>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<Card/>);
</script>
</body>
</html>
